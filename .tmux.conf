# Power-user tmux configuration

# Prefix: Ctrl-a is easier to reach than Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General behavior
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Start indexes at 1; keep pane indexes at 1 for fast targeting.
set -g base-index 1
setw -g pane-base-index 1

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes in current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-like pane navigation; Alt-arrows work without prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes with prefix + H/J/K/L; Alt-arrows resize without prefix.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind -n M-Left resize-pane -L 5
bind -n M-Down resize-pane -D 5
bind -n M-Up resize-pane -U 5
bind -n M-Right resize-pane -R 5

# Useful pane actions.
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window
bind z resize-pane -Z
bind q display-panes
bind o select-pane -t :. +
bind Space next-layout
bind BSpace previous-window

# Window movement and quick window selection.
bind C-h previous-window
bind C-l next-window
bind -n C-S-Left previous-window
bind -n C-S-Right next-window
bind Tab last-window
bind { swap-pane -U
bind } swap-pane -D

# Vi copy mode + macOS clipboard.
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Status bar.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left " #[fg=#89b4fa,bold]#S #[fg=#6c7086]│ "
set -g status-left-length 30
set -g status-right "#[fg=#6c7086]%Y-%m-%d %H:%M"
set -g status-right-length 20
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
setw -g window-status-format " #[fg=#6c7086]#I:#W "
setw -g window-status-current-format " #[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[fg=#89b4fa,bg=#1e1e2e]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#f9e2af,bold"
setw -g window-status-bell-style "fg=#f38ba8,bold"

# Pane borders and messages.
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#6c7086"

# Optional TPM support when installed; config remains usable without it.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
